<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chatbot tư vấn tour</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
        }

        .chat-container {
            max-width: 900px;
            margin: 50px auto;
        }

        .chat-box {
            height: 500px;
            overflow-y: auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .message {
            margin-bottom: 15px;
        }

        .user-message {
            text-align: right;
        }

        .user-message span {
            display: inline-block;
            background: #0d6efd;
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
        }

        .bot-message span {
            display: inline-block;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 15px;
            white-space: pre-line;
        }

    </style>

</head>

<body>

<div class="container chat-container">

    <div class="text-center mb-4">

        <h1>🤖 Chatbot tư vấn tour</h1>

        <p class="text-muted">
            Hỏi tôi về tour du lịch, giá, thời gian và địa điểm.
        </p>

    </div>


    <div
        id="chatBox"
        class="chat-box mb-3"
    >

        <div class="message bot-message">

            <span>
                👋 Xin chào! Tôi có thể giúp bạn
                tìm kiếm và tư vấn tour du lịch.
            </span>

        </div>

    </div>


    <div class="input-group">

        <input
            type="text"
            id="question"
            class="form-control"
            placeholder="Nhập câu hỏi..."
            autocomplete="off"
        >

        <button
            class="btn btn-primary"
            onclick="sendMessage()"
        >
            Gửi
        </button>

    </div>

</div>


<script>

async function sendMessage() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    if (!question) {
        return;
    }


    const chatBox =
        document.getElementById("chatBox");


    // Hiển thị câu hỏi
    chatBox.innerHTML += `

        <div class="message user-message">

            <span>
                ${question}
            </span>

        </div>

    `;


    input.value = "";


    // Hiển thị đang xử lý
    chatBox.innerHTML += `

        <div
            class="message bot-message"
            id="loading"
        >

            <span>
                🤔 Đang suy nghĩ...
            </span>

        </div>

    `;


    chatBox.scrollTop =
        chatBox.scrollHeight;


    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


        const data =
            await response.json();


        // Xóa loading
        const loading =
            document.getElementById("loading");

        if (loading) {
            loading.remove();
        }


        // Hiển thị câu trả lời
        chatBox.innerHTML += `

            <div class="message bot-message">

                <span>
                    🤖 ${data.answer}
                </span>

            </div>

        `;


        chatBox.scrollTop =
            chatBox.scrollHeight;


    } catch (error) {

        const loading =
            document.getElementById("loading");

        if (loading) {
            loading.remove();
        }

        chatBox.innerHTML += `

            <div class="message bot-message">

                <span>
                    ❌ Có lỗi xảy ra khi kết nối chatbot.
                </span>

            </div>

        `;

        console.error(error);
    }
}


// Nhấn Enter để gửi
document
    .getElementById("question")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );

</script>

</body>

</html>
