{% extends "base.html" %}

{% block title %}Đăng nhập - TourAI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <span class="fs-1">🔐</span>
                    <h2 class="fw-bold mt-2">Đăng Nhập</h2>
                    <p class="text-muted small">Đăng nhập để trải nghiệm đầy đủ tính năng và lưu lịch sử hỏi đáp</p>
                </div>

                <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" value="{{ username or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                    </button>

                    <div class="text-center small text-muted">
                        Chưa có tài khoản? <a href="/register" class="fw-bold text-decoration-none">Đăng ký ngay</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
