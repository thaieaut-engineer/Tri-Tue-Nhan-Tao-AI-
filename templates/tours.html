<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <title>Danh sách tour</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        🌏 Danh sách tour du lịch
    </h1>

    <div class="row">

        {% for tour in tours %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow-sm">

                {% if tour.image %}

                <img
                    src="{{ tour.image }}"
                    class="card-img-top"
                    style="height: 220px; object-fit: cover;"
                >

                {% endif %}

                <div class="card-body">

                    <h5 class="card-title">
                        {{ tour.name }}
                    </h5>

                    <p class="card-text">
                        📍 {{ tour.destination }}
                    </p>

                    <p class="card-text">
                        ⏱ {{ tour.duration }}
                    </p>

                    <p class="text-danger fw-bold">
                        💰 {{ "{:,.0f}".format(tour.price) }} VNĐ
                    </p>

                    <p class="card-text">
                        {{ tour.description }}
                    </p>

                    <a
                        href="/tours/{{ tour.id }}"
                        class="btn btn-primary"
                    >
                        Xem chi tiết
                    </a>

                </div>

            </div>

        </div>

        {% else %}

        <div class="alert alert-warning">
            Chưa có tour nào.
        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
